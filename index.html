<!DOCTYPE html>
<html lang="en" ng-app="northfield">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northfield Goods</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand bg-white border-bottom" ng-controller="NavController">
  <div class="container">
    <a class="navbar-brand brand" href="#!/">Northfield Goods</a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <a href="#!/cart">Cart <span class="badge bg-dark">{{count()}}</span></a>
      <span ng-if="user()">Hi, {{user().name.split(' ')[0]}} <a href="" ng-click="logout()">Log out</a></span>
      <span ng-if="!user()"><a href="#!/login">Log in</a> · <a href="#!/signup">Sign up</a></span>
    </div>
  </div>
</nav>
<div ng-view></div>
<footer class="text-center text-muted py-4 small">© Northfield Goods · demo store</footer>
<div class="toast-box" ng-controller="ToastController" ng-if="t.msg">{{t.msg}}</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular-route.min.js"></script>
<script src="js/app.js"></script>
<script src="js/services/storage.service.js"></script>
<script src="js/services/toast.service.js"></script>
<script src="js/services/product.service.js"></script>
<script src="js/services/auth.service.js"></script>
<script src="js/services/cart.service.js"></script>
<script src="js/services/review.service.js"></script>
<script src="js/services/order.service.js"></script>
<script src="js/controllers/nav.controller.js"></script>
<script src="js/controllers/home.controller.js"></script>
<script src="js/controllers/cart.controller.js"></script>
<script src="js/controllers/checkout.controller.js"></script>
<script src="js/controllers/auth.controller.js"></script>
</body>
</html>
