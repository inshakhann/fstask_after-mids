<main class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-4">
  <h2 class="mb-3">Create your account</h2>
  <form class="card card-body gap-3" ng-submit="submit()">
    <div><label class="form-label">Full name</label><input class="form-control" ng-model="f.name" required></div>
    <div><label class="form-label">Email</label><input type="email" class="form-control" ng-model="f.email" required></div>
    <div><label class="form-label">Password (min 6 characters)</label><input type="password" class="form-control" ng-model="f.pass" ng-minlength="6" required></div>
    <div class="text-danger small">{{error}}</div>
    <button class="btn btn-accent">Sign up</button>
  </form>
  <p class="mt-3">Already registered? <a href="#!/login">Log in</a></p>
</div></div></main>
